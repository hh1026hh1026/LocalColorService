name: Feature Request
description: Propose a new feature, enhancement, or algorithm for LocalColorService
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a new feature or improvement!
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or specific workflow?
      placeholder: I would like to use LocalColorService for...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, API design sketches, or screenshots.
